project_id = "sgb-employee-portal-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = [
  "http://localhost:3100/",
  "http://localhost:3100/auth/callback?flow=invite",
  "http://localhost:3100/auth/callback?flow=recovery",
  "http://localhost:3100/auth/callback?flow=login"
]
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.invite]
subject = "Your SGB Engineering portal invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your SGB Engineering portal password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
